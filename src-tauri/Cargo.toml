[package]
name = "world-clock"
version = "0.5.0"
description = "Desktop world clock widget with a live day/night map"
authors = ["silent-diffusion"]
license = "MIT"
repository = "https://github.com/silent-diffusion/world-clock"
edition = "2021"

[lib]
name = "world_clock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
reqwest = { version = "0.13.5", features = ["json"] }
sha2 = "0.11.1"
