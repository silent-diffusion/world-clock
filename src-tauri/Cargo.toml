[package]
name = "world-clock"
version = "1.3.2"
description = "Desktop world clock widget with a live day/night map"
authors = ["silent-diffusion"]
license = "MIT"
repository = "https://github.com/silent-diffusion/world-clock"
edition = "2021"

[lib]
name = "world_clock_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri-plugin-opener = "2.7.2"
tauri-plugin-dialog = "2.8.3"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.4"
tauri-plugin-window-state = "2.5.0"
reqwest = { version = "0.13.5", features = ["json"] }
sha2 = "0.11.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
] }
