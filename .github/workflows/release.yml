# Builds the Windows installer and publishes it as a GitHub Release when a version tag (e.g. v0.1.0) is pushed.
# Installed copies of the app find new releases through the GitHub API and link to the installer.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - run: npm ci

      # Fails if Cargo.lock is missing or out of date, so the release builds exactly the committed versions.
      - name: Check Cargo.lock
        working-directory: src-tauri
        run: cargo fetch --locked

      - name: Build and publish release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: World Clock ${{ github.ref_name }}
          generateReleaseNotes: true
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: false

      # A copy with a fixed name, so .../releases/latest/download/World-Clock-Setup.exe always gets the newest installer.
      - name: Upload installer under a fixed name
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          installer=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$installer" World-Clock-Setup.exe
          gh release upload "$TAG" World-Clock-Setup.exe --clobber
